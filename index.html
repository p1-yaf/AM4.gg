<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#03070d">
    <title>AM4 SMP | تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background"><div class="grid"></div><div class="glow glow-one"></div><div class="glow glow-two"></div><div class="particles"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>

<main class="login-page">
    <section class="intro">
        <div class="badge"><span></span> AM4 SMP</div>
        <h1>جاهز تبدأ<br><em>مغامرتك؟</em></h1>
        <p>نورت AM4. سجل بحساب Discord بتاعك وادخل على عالمك.</p>
        <div class="chips">
            <div>⛏️ <b>Survival</b><small>عالمك على مزاجك</small></div>
            <div>⚔️ <b>Free World</b><small>مفيش حدود لمغامرتك</small></div>
        </div>
    </section>

    <section class="login-card">
        <div class="top-line"></div>
        <div class="logo-wrap"><div class="logo-ring"></div><img src="logo.png" alt="AM4 SMP"></div>
        <div class="heading"><small>WELCOME TO</small><h2>AM4 <span>SMP</span></h2><p>سجل مرة واحدة وخلاص.</p></div>

        <button id="discord-btn" class="discord-btn">
            <span class="discord-icon">◉</span>
            <b>تسجيل الدخول بـ Discord</b>
            <span class="arrow">←</span>
        </button>
        <div class="secure">🔒 تسجيل الدخول بيتم عن طريق Discord بشكل آمن</div>
        <p class="terms">بدخولك أنت موافق على قوانين AM4 SMP.</p>
    </section>
</main>
<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
